services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pulseops}
      MYSQL_USER: ${MYSQL_USER:-pulseops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pulseops}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
    ports:
      # host 3307 -> container 3306, to avoid clashing with a local MySQL
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rootpw}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PULSEOPS_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-pulseops}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      PULSEOPS_DB_USER: ${MYSQL_USER:-pulseops}
      PULSEOPS_DB_PASSWORD: ${MYSQL_PASSWORD:-pulseops}
      PULSEOPS_CORS_ALLOWED_ORIGINS: http://localhost:8088
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  mysql-data:
